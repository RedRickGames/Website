  <style>
    :root{color-scheme:dark;--bg:#08090b;--surface:#111317;--red:#B00F2A;--red-soft:#861326;--text:#f4f4f5;--muted:#a2a4ab;--line:#292b30}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:#08090b;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.55;min-height:100vh;isolation:isolate}
    /* Static ambient lighting: crimson glow bottom left and along the right edge. */
    .ambient{
      position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
      background:
        radial-gradient(ellipse 52% 57% at 0% 100%,rgba(176,15,42,.27) 0%,rgba(116,13,34,.13) 31%,transparent 76%),
        radial-gradient(ellipse 37% 72% at 103% 50%,rgba(176,15,42,.23) 0%,rgba(112,12,32,.12) 33%,transparent 78%),
        #090a0c;
    }
    a{color:inherit;text-decoration:none}
    a:focus-visible{outline:2px solid var(--red);outline-offset:5px}
    .shell{width:min(1100px,calc(100% - 64px));margin:auto;position:relative;z-index:1}
    .top{display:flex;align-items:center;justify-content:space-between;padding:30px 0;border-bottom:1px solid var(--line);gap:24px}
    .identity{display:flex;align-items:center;gap:14px;font-size:1.35rem;font-weight:760;letter-spacing:-.045em}
    .identity img{width:52px;height:52px;object-fit:contain;image-rendering:pixelated}
    .identity span{color:var(--text)}.identity .brand-red{color:var(--red)}
    .hero{padding:48px 0 48px;max-width:800px}
    .eyebrow{color:var(--red);text-transform:uppercase;letter-spacing:.18em;font-weight:800;font-size:.77rem;display:flex;align-items:center;gap:12px}
    
    h1{font-size:clamp(2.9rem,7vw,6rem);letter-spacing:-.075em;line-height:1.04;font-weight:840;margin:17px 0 0;max-width:850px}
    h1 .hero-red{color:var(--red)} h1 .hero-white{color:var(--text)}
    .sub{font-size:clamp(1.04rem,1.6vw,1.2rem);color:var(--muted);max-width:560px;margin:0}
    .section-top{display:flex;align-items:end;justify-content:space-between;gap:20px;margin:0 0 25px}
    h2{color:var(--text);font-size:clamp(1.8rem,3vw,2.4rem);letter-spacing:-.055em;line-height:1.1;margin:0;font-weight:780}
    .section-note{font-size:.93rem;color:var(--muted)}
    .projects{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
    .project{display:block;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:transform .2s,border-color .2s,box-shadow .2s}
    .project:hover{transform:translateY(-5px);border-color:#B02740;box-shadow:0 16px 44px #0007}
    .poster{aspect-ratio:616/353;background:#101019;overflow:hidden}
    .poster img{height:100%;width:100%;object-fit:cover;display:block}
    .project-info{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:22px 23px 23px}
    .project h3{font-size:1.16rem;line-height:1.3;margin:0 0 4px;font-weight:760;letter-spacing:-.025em}
    .project p{margin:0;color:var(--muted);font-size:.88rem}
    .project .out{color:var(--red);display:grid;place-items:center;width:35px;height:35px;flex-shrink:0;border:1px solid #963044;border-radius:50%;font-size:1.1rem}
    footer{display:flex;flex-direction:column;gap:12px;align-items:flex-start;color:var(--muted);font-size:.92rem;margin-top:38px;border-top:1px solid var(--line);padding:24px 0 42px}footer h2{color:var(--text);font-size:1.65rem;margin:0 0 6px}footer .copyright{margin-top:9px;font-size:.84rem}
    footer a{color:var(--text);text-decoration:none;display:inline-flex;align-items:center}
    footer a:hover{color:var(--red)}
    @media(max-width:700px){.shell{width:min(100% - 38px,1100px)}.top{padding:20px 0}.identity{font-size:1.12rem;gap:9px}.identity img{width:42px;height:42px}.hero{padding:36px 0 40px}.projects{grid-template-columns:1fr;gap:19px}footer{flex-wrap:wrap}.section-note{display:none}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
  </style>
</head>
<body>
<div class="ambient" aria-hidden="true"></div>
